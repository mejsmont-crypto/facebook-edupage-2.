<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Aktualności szkoły – Facebook</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#1d3048;background:#fff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1160px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.top h1{font-size:clamp(19px,3vw,25px);margin:0}.top a,.more{color:#fff;background:#1877f2;text-decoration:none;padding:10px 15px;border-radius:9px;font-weight:650;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}.post{border:1px solid #dce5ef;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 8px #122c4a0a}.post .body{padding:16px}.meta{font-size:13px;color:#64748b;margin-bottom:10px}.msg{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:15px;max-height:17em;overflow:hidden}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}.gallery img{display:block;width:100%;height:170px;object-fit:cover}.gallery img:only-child{height:auto;max-height:440px;object-fit:contain;background:#f3f6fa;grid-column:1/-1}.more{display:inline-block;margin-top:14px}.status{color:#64748b;font-size:14px;padding:14px}.foot{color:#64748b;font-size:12px;margin-top:16px} @media(max-width:430px){.wrap{padding:9px}.grid{gap:10px}.post .body{padding:12px}.gallery img{height:125px}}
</style></head><body><main class="wrap"><div class="top"><h1>Aktualności z Facebooka</h1><a href="https://www.facebook.com/zsdygowo" target="_blank" rel="noopener noreferrer">Profil szkoły ↗</a></div><div id="feed" class="grid" aria-live="polite"><p class="status">Ładowanie aktualności…</p></div><p class="foot" id="updated"></p></main><script>
const feed=document.getElementById('feed');
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
fetch('./posts.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Brak danych');return r.json()}).then(data=>{
 feed.replaceChildren();const posts=Array.isArray(data.posts)?data.posts:[];
 if(!posts.length){feed.append(el('p','status','Brak wpisów do wyświetlenia. Zajrzyj na profil szkoły.'));return}
 for(const p of posts){const card=el('article','post');const imgs=(p.images||[]).filter(u=>typeof u==='string'&&u.startsWith('https://')).slice(0,4);
 if(imgs.length){const gal=el('div','gallery');for(const u of imgs){const im=el('img');im.src=u;im.loading='lazy';im.alt='Zdjęcie z aktualności szkolnej';im.referrerPolicy='no-referrer';gal.append(im)}card.append(gal)}
 const body=el('div','body');const dt=new Date(p.created_time);body.append(el('div','meta',Number.isNaN(dt.getTime())?'Facebook':dt.toLocaleDateString('pl-PL',{year:'numeric',month:'long',day:'numeric'})));
 if(p.message)body.append(el('div','msg',p.message));const a=el('a','more','Zobacz pełny post ↗');a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';body.append(a);card.append(body);feed.append(card)}
 if(data.updated_at){const d=new Date(data.updated_at);if(!Number.isNaN(d.getTime()))document.getElementById('updated').textContent='Ostatnia synchronizacja: '+d.toLocaleString('pl-PL')}
}).catch(()=>{feed.replaceChildren(el('p','status','Nie udało się pobrać aktualności. Otwórz profil szkoły na Facebooku.'))});
</script></body></html>
